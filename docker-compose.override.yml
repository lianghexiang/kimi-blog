# ═══════════════════════════════════════════════════════════════
# Docker Compose Development Override
# 自动被 docker compose 加载，用于本地开发
# 生产部署请使用: docker compose -f docker-compose.yml up -d
# ═══════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend:ro
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PORT: 8000
