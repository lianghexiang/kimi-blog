services:
  db:
    image: mysql:8.0
    container_name: kimiblog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kimiblog_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kimi_blog}
      MYSQL_USER: ${MYSQL_USER:-kimiblog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kimiblog_pass}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kimiblog-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_KIMI_AUTH_URL: ${VITE_KIMI_AUTH_URL:-}
        VITE_APP_ID: ${VITE_APP_ID:-}
    container_name: kimiblog-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ID: ${APP_ID:-}
      APP_SECRET: ${APP_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-mysql://kimiblog:kimiblog_pass@db:3306/kimi_blog}
      KIMI_AUTH_URL: ${KIMI_AUTH_URL:-}
      KIMI_OPEN_URL: ${KIMI_OPEN_URL:-}
      OWNER_UNION_ID: ${OWNER_UNION_ID:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: 5000
      # CORS_ORIGINS: comma-separated list, e.g. https://your-domain.com
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # MinIO 对象存储（在容器网络内通过服务名 minio 访问）
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-blog-uploads}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
    ports:
      - "3030:5000"
    networks:
      - kimiblog-net

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: kimiblog-minio
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9005:9000"
      - "9006:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kimiblog-net

volumes:
  db_data:
  minio_data:

networks:
  kimiblog-net:
    driver: bridge
